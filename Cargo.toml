[workspace]
resolver = "2"
members = [
    "crates/rbsp",
    "crates/rdoc",
    "crates/rir",
    "crates/rcomp",
    "crates/rbake",
    "crates/rterrain",
    "crates/rpak",
    "crates/r5ed-wasm",
    "crates/r5ed-host",
    "crates/r5ed-compile",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.94"
license = "AGPL-3.0-or-later"

[workspace.dependencies]
rbsp = { path = "crates/rbsp" }
rdoc = { path = "crates/rdoc", default-features = false }
rir = { path = "crates/rir" }
rcomp = { path = "crates/rcomp" }
rbake = { path = "crates/rbake", default-features = false }
rterrain = { path = "crates/rterrain", default-features = false }
rpak = { path = "crates/rpak" }
anyhow = "1"
thiserror = "2"
bytemuck = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
indexmap = { version = "2", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde", "js"] }
glam = { version = "0.30", features = ["serde", "bytemuck"] }
rayon = "1"
robust = "1"
spade = "2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[profile.release.package.r5ed-wasm]
opt-level = "s"
